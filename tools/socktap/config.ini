; Vanetza Config File

[general]
debug_enabled=false             
interface=wlan0
gpsd_host=127.0.0.1
gpsd_port=2947
prometheus_port=9100
rssi_enabled=true
mcs_enabled=false                                  
ignore_own_messages=true
ignore_rsu_messages=false
num_threads=-1
publish_encoded_payloads=true
security=none                                       ; none, dummy

[mqtt]
local_mqtt_broker=127.0.0.1
local_mqtt_port=1883
remote_mqtt_broker=""
remote_mqtt_port=0
remote_mqtt_username=""
remote_mqtt_password=""

[dds]
dds_domain_id=0
dds_participant_name=Vanetza
dds_blocked_interfaces=wlan0

[zenoh]
zenoh_local_only=true
zenoh_interfaces=""

[ipv4]
enabled=false
address=239.118.122.97
port=8947
interface=eth0

[station]
id=99       
type=15
mac_address=6e:06:e0:03:00:ff
beacons_enabled=true
use_hardcoded_gps=true
latitude=40          
longitude=-8

[cam]
enabled=true
mqtt_enabled=true
dds_enabled=true
zenoh_enabled=true
mqtt_time_enabled=true
mqtt_test_enabled=false                                
periodicity=1000                                ; in milliseconds - 0 to disable
topic_in=vanetza/in/cam
topic_out=vanetza/out/cam
topic_time=vanetza/time/cam
topic_test=vanetza/test/cam                     ; empty to disable
own_topic_out=vanetza/own/cam                   ; empty to disable
udp_out_addr=127.0.0.1
udp_out_port=5004                               ; 0 to disable

